aid: camion
name: Camion
description: 'Camion is an infrastructure-intelligence platform accelerating the electrification
  of real estate portfolios. Its AI-driven platform indexes properties by their readiness
  and potential for electrification, forecasts energy demand, and optimizes the placement
  of solar, storage, and EV-charging infrastructure so the largest real estate owners
  and infrastructure developers can underwrite and deploy energy upgrades at scale.
  Camion positions itself as an "always-on energy department" that delivers consultant-grade
  investment cases without manual dashboard monitoring. Founded in 2023 and based in
  London, Camion raised a EUR 2.7M pre-seed round led by EQT Ventures in April 2024.
  Sector: energy-and-environmental. This profile was added to the API Evangelist network
  as a portfolio-lead stub; Camion publishes no public developer or API surface at this time.'
